name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build module
        run: |
          docker build -t bristol-builder -f scripts/Dockerfile .
          docker run --rm -v "$PWD:/build" -w /build bristol-builder ./scripts/build.sh

      - name: Upload release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/bristol-module.tar.gz
